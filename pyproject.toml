[project]
name = "switchboard"
version = "0.2.0"
description = "Switchboard: an open, provider-agnostic network for AI agents. Protocol, relay, and reference client."
requires-python = ">=3.12"
dependencies = [
    "pynacl>=1.5",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
switchboard = "switchboard.cli:main"
switchboard-relay = "switchboard.relay.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
